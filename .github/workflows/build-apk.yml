name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '8933bad161af4178b1185d1a37fbf41ea5269c' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf 'd56f5187479451eabfb336dd4c4c4f680ab' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - run: npm ci
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Firmar release
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/base-elite-key.p12
          python3 - <<'PYEOF'
          import os
          p = 'android/app/build.gradle'
          s = open(p).read()
          s = s.replace('versionCode 1', 'versionCode ' + os.environ['GITHUB_RUN_NUMBER'])
          s = s.replace('versionName "1.0"', 'versionName "1.0.' + os.environ['GITHUB_RUN_NUMBER'] + '"')
          sign = ("    signingConfigs {\n        release {\n            storeFile file('../base-elite-key.p12')\n"
                  "            storePassword System.getenv('KEYSTORE_PASS')\n"
                  "            keyAlias System.getenv('KEY_ALIAS')\n"
                  "            keyPassword System.getenv('KEY_PASS')\n"
                  "            storeType 'PKCS12'\n        }\n    }\n")
          assert '    buildTypes {' in s
          s = s.replace('    buildTypes {', sign + '    buildTypes {', 1)
          old = "    buildTypes {\n        release {\n            minifyEnabled false"
          new = "    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false"
          assert old in s
          s = s.replace(old, new, 1)
          open(p, 'w').write(s)
          print('build.gradle firmado, versionCode=' + os.environ['GITHUB_RUN_NUMBER'])
          PYEOF

      - name: Build release APK
        timeout-minutes: 20
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: base-elite-apk
          path: android/app/build/outputs/apk/release/app-release.apk
