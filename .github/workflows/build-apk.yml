name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '8933bad161af4178b1185d1a37fbf41ea5269c' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf 'd56f5187479451eabfb336dd4c4c4f680ab' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - run: npm ci
      - run: npx cap add android
      - run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: base-elite-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
